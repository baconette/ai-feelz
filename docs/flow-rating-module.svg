<svg viewBox="0 0 1100 1120" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Feature 1 user flow, updated for PRD v0.4 and bundle terminology</title>
<desc>Restores the arrival-type decision (direct vs. shared link, each with its own landing screen) before start rating. Domain intro step removed; start rating notes 10-use-case bundles; adds optional description handling with a request-explanation action, and a conditional free-text "why" field shown only after a negative-pole rating.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
</marker>
</defs>
<style>
.box { fill: #FFFFFF; stroke: #D3D1C7; stroke-width:1.5; }
.decision { fill: #F1EFE8; stroke: #D3D1C7; stroke-width:1.5; }
.optional { fill: #FFFFFF; stroke: #D3D1C7; stroke-width:1.5; stroke-dasharray:4,3; }
.end { fill: #FFFFFF; stroke: #2C2C2A; stroke-width:2; }
.entry { fill: #2C2C2A; }
.title { font-size:14px; font-weight:600; fill: #2C2C2A; font-family: Arial, sans-serif; }
.sub { font-size:11px; fill: #5F5E5A; font-family: Arial, sans-serif; }
.label { font-size:11px; fill: #5F5E5A; font-family: Arial, sans-serif; }
.entrylabel { font-size:12px; font-weight:600; fill: #FFFFFF; font-family: Arial, sans-serif; }
.edge { stroke: #5F5E5A; stroke-width:1.5; fill:none; marker-end:url(#arrow2); }
</style>

<ellipse cx="550" cy="30" rx="70" ry="24" class="entry"/>
<text x="550" y="35" text-anchor="middle" class="entrylabel">Visitor arrives</text>
<path class="edge" d="M550,54 L550,70"/>

<polygon points="550,70 650,110 550,150 450,110" class="decision"/>
<text x="550" y="106" text-anchor="middle" class="title">Arrival</text>
<text x="550" y="122" text-anchor="middle" class="sub">type?</text>

<rect x="330" y="190" width="180" height="60" class="box"/>
<text x="420" y="215" text-anchor="middle" class="title">Landing screen</text>
<text x="420" y="233" text-anchor="middle" class="sub">explains concept in &lt;10s</text>
<path class="edge" d="M450,110 L420,190"/>
<text x="380" y="160" class="label">direct / organic</text>

<rect x="590" y="190" width="200" height="70" class="box"/>
<text x="690" y="213" text-anchor="middle" class="title">Landing screen</text>
<text x="690" y="230" text-anchor="middle" class="sub">+ sharer's profile preview</text>
<text x="690" y="246" text-anchor="middle" class="sub">"see how yours compares"</text>
<path class="edge" d="M650,110 L690,190"/>
<text x="640" y="160" class="label">shared link</text>

<rect x="440" y="300" width="220" height="60" class="box"/>
<text x="550" y="327" text-anchor="middle" class="title">Start rating</text>
<text x="550" y="344" text-anchor="middle" class="sub">rates 10 use cases per bundle</text>
<path class="edge" d="M420,250 L470,300"/>
<path class="edge" d="M690,260 L630,300"/>

<path class="edge" d="M550,360 L550,390"/>

<rect x="330" y="390" width="220" height="80" class="box"/>
<text x="440" y="415" text-anchor="middle" class="title">Use case card</text>
<text x="440" y="432" text-anchor="middle" class="sub">description shown if present</text>
<text x="440" y="448" text-anchor="middle" class="sub">"no description yet" if absent</text>
<text x="440" y="463" text-anchor="middle" class="sub" font-style="italic">both states rateable now</text>

<rect x="620" y="400" width="220" height="60" class="optional"/>
<text x="730" y="425" text-anchor="middle" class="title">Requests explanation</text>
<text x="730" y="442" text-anchor="middle" class="sub">flags for content team, non-blocking</text>
<path class="edge" d="M550,430 L620,430"/>
<text x="560" y="420" class="label">optional</text>

<path class="edge" d="M440,470 L440,500"/>

<rect x="330" y="500" width="220" height="60" class="box"/>
<text x="440" y="525" text-anchor="middle" class="title">Rates use case</text>
<text x="440" y="542" text-anchor="middle" class="sub">mechanic/framing TBD, progress advances</text>

<path class="edge" d="M440,560 L440,590"/>

<polygon points="440,590 540,630 440,670 340,630" class="decision"/>
<text x="440" y="626" text-anchor="middle" class="title">Negative-pole</text>
<text x="440" y="642" text-anchor="middle" class="sub">rating?</text>

<rect x="620" y="600" width="240" height="60" class="optional"/>
<text x="740" y="625" text-anchor="middle" class="title">Optional "why" field</text>
<text x="740" y="642" text-anchor="middle" class="sub">free text, skippable, never required</text>
<path class="edge" d="M540,625 L620,625"/>
<text x="560" y="615" class="label">yes</text>

<path class="edge" d="M440,670 L440,700"/>
<text x="460" y="690" class="label">no</text>
<path class="edge" d="M740,660 C740,700 550,700 440,700" />

<polygon points="440,740 540,780 440,820 340,780" class="decision"/>
<text x="440" y="776" text-anchor="middle" class="title">More use</text>
<text x="440" y="792" text-anchor="middle" class="sub">cases left?</text>
<path class="edge" d="M440,700 L440,740"/>

<path class="edge" d="M340,775 C230,775 230,430 330,430" />
<text x="160" y="610" class="label">yes, next card</text>

<ellipse cx="820" cy="780" rx="120" ry="30" class="end"/>
<text x="820" y="776" text-anchor="middle" class="title">Leaves mid-bundle</text>
<text x="820" y="792" text-anchor="middle" class="sub">no penalty, no save (v1)</text>
<path class="edge" d="M550,535 C700,590 820,690 820,750" stroke-dasharray="4,3"/>

<ellipse cx="440" cy="900" rx="150" ry="34" class="end"/>
<text x="440" y="896" text-anchor="middle" class="title">Domain ratings complete</text>
<text x="440" y="913" text-anchor="middle" class="sub">to Feature 2 — Results</text>
<path class="edge" d="M440,820 L440,866"/>
<text x="470" y="845" class="label">no</text>

<rect x="60" y="1000" width="16" height="16" class="optional"/>
<text x="86" y="1012" class="label">optional / non-blocking action</text>
<text x="60" y="1040" class="sub">Scope: Creative or Healthcare domain, single subdomain, per prototype scope.</text>
</svg>
