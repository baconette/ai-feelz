<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Launch plan: phases 1 through 5, left to right, with top actions per phase</title>
<desc>A horizontal flowchart of five launch phases with their top three actions shown above each phase box, a launch-readiness gate between alpha and beta, and a parallel recruiter track spanning beta through full launch with its own top three actions shown below.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>

<g>
<rect x="252" y="20" width="56" height="22" rx="11" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="280" y="31" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#412402">Gate</text>
</g>
<path d="M280 42 L280 168" fill="none" stroke="#854F0B" stroke-width="1" stroke-dasharray="3 3"/>

<rect x="50" y="62" width="100" height="54" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="58" y="78" font-family="sans-serif" font-size="12" fill="#444441">5-10 testers</text>
<text x="58" y="92" font-family="sans-serif" font-size="12" fill="#444441">Jargon check</text>
<text x="58" y="106" font-family="sans-serif" font-size="12" fill="#444441">Check edges</text>

<rect x="170" y="62" width="100" height="54" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="178" y="78" font-family="sans-serif" font-size="12" fill="#444441">Landing page</text>
<text x="178" y="92" font-family="sans-serif" font-size="12" fill="#444441">Invite peers</text>
<text x="178" y="106" font-family="sans-serif" font-size="12" fill="#444441">25+ responses</text>

<rect x="290" y="62" width="100" height="54" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="298" y="78" font-family="sans-serif" font-size="12" fill="#444441">Draft study</text>
<text x="298" y="92" font-family="sans-serif" font-size="12" fill="#444441">Find creator</text>
<text x="298" y="106" font-family="sans-serif" font-size="12" fill="#444441">Pick platform</text>

<rect x="410" y="62" width="100" height="54" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="418" y="78" font-family="sans-serif" font-size="12" fill="#444441">Show results</text>
<text x="418" y="92" font-family="sans-serif" font-size="12" fill="#444441">Batch invites</text>
<text x="418" y="106" font-family="sans-serif" font-size="12" fill="#444441">Finish study</text>

<rect x="530" y="62" width="100" height="54" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="538" y="78" font-family="sans-serif" font-size="12" fill="#444441">PH listing</text>
<text x="538" y="92" font-family="sans-serif" font-size="12" fill="#444441">LinkedIn post</text>
<text x="538" y="106" font-family="sans-serif" font-size="12" fill="#444441">Send email</text>

<line x1="150" y1="168" x2="170" y2="168" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="270" y1="168" x2="290" y2="168" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="390" y1="168" x2="410" y2="168" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="510" y1="168" x2="530" y2="168" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="50" y="136" width="100" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="100" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">1 Internal</text>
<text x="100" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Test rating</text>
</g>

<g>
<rect x="170" y="136" width="100" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="220" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">2 Alpha</text>
<text x="220" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">25+ ratings</text>
</g>

<g>
<rect x="290" y="136" width="100" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">3 Beta</text>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Case study</text>
</g>

<g>
<rect x="410" y="136" width="100" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="460" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">4 Early</text>
<text x="460" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Scale up</text>
</g>

<g>
<rect x="530" y="136" width="100" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="580" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">5 Full</text>
<text x="580" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Go public</text>
</g>

<path d="M290 224 L630 224" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="290" cy="224" r="3" fill="#7F77DD"/>
<circle cx="630" cy="224" r="3" fill="#7F77DD"/>
<g>
<rect x="390" y="212" width="140" height="24" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="460" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#26215C">Recruiter track</text>
</g>

<rect x="350" y="256" width="220" height="54" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="362" y="274" font-family="sans-serif" font-size="12" fill="#444441">Publish case study</text>
<text x="362" y="288" font-family="sans-serif" font-size="12" fill="#444441">Post on LinkedIn</text>
<text x="362" y="302" font-family="sans-serif" font-size="12" fill="#444441">Track recruiter replies</text>

<text x="340" y="334" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">gray = phase steps · amber = launch gate · purple = parallel recruiter track</text>
</svg>
